on: [push, pull_request, workflow_dispatch]
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the repository
      - name: Check out code
        uses: actions/checkout@v2

      # 2. Set up .NET SDK
      - name: Set up .NET
        uses: actions/setup-dotnet@v1
        with:
          # Change to match your .NET version
          dotnet-version: '8.0'

      # 3. Restore dependencies
      - name: Restore
        run: dotnet restore

      # 4. Build the solution
      - name: Build
        run: dotnet build --no-restore --configuration Release

      # 5. Run tests
      # (If you have test projects, specify them or let it discover automatically)
      - name: Test
        run: dotnet test --no-build --configuration Release